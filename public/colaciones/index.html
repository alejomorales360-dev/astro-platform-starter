<!--
╔══════════════════════════════════════════════════════════════════╗
║  COLACIONES SEMANALES · Control de inscripción al menú           ║
╠══════════════════════════════════════════════════════════════════╣
║  QUÉ RESUELVE:                                                    ║
║   - Evita que trabajadores queden sin anotarse a la colación      ║
║   - Evita anotaciones duplicadas (una opción por día y persona)   ║
║   - Da al admin una vista clara de quién falta por anotarse       ║
║                                                                    ║
║  CÓMO CONFIGURAR:                                                 ║
║   1. Crea una planilla de Google Sheets nueva                     ║
║   2. Extensiones → Apps Script → pega el contenido de             ║
║      gas/Colaciones.gs de este repo                                ║
║   3. En el editor de Apps Script, ejecuta la función               ║
║      "crearHojasIniciales" una vez (crea las hojas y una clave     ║
║      de admin por defecto: cambiar123)                             ║
║   4. Implementar → Nueva implementación → Aplicación web           ║
║      (Ejecutar como: Yo · Acceso: Cualquier persona)                ║
║   5. Copia la URL /exec y pégala abajo en GAS_URL                  ║
║   6. Cambia la clave admin_password en la hoja "Config"            ║
║   7. Carga a tus ~67 trabajadores en la hoja "Trabajadores"        ║
╚══════════════════════════════════════════════════════════════════╝
-->

<body>

<div id="app"></div>

<script>
(function(){
'use strict';

const DIAS = ['Lunes','Martes','Miercoles','Jueves','Viernes'];
const state = {
  role: null,        // 'admin' | 'trabajador'
  admin: false,
  trabajador: null,  // {rut,nombre,tipo}
  data: { trabajadores:[], menus:[], pedidos:[], config:{} },
  semanaRef: mondayOf(new Date()),
  adminTab: 'trabajadores',
  msg: null
};

// ---------- fechas ----------
function mondayOf(d){
  const x = new Date(d);
  const day = x.getDay(); // 0=domingo
  const diff = (day === 0 ? -6 : 1 - day);
  x.setDate(x.getDate() + diff);
  x.setHours(0,0,0,0);
  return x;
}
function iso(d){ return d.toISOString().slice(0,10); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtSemana(d){
  const fin = addDays(d,4);
  const opt = {day:'numeric',month:'short'};
  return `${d.toLocaleDateString('es-CL',opt)} – ${fin.toLocaleDateString('es-CL',opt)} (${d.getFullYear()})`;
}
function fechaDia(semanaMonday, diaNombre){
  const idx = DIAS.indexOf(diaNombre);
  return iso(addDays(semanaMonday, idx));
}

// ---------- API ----------
function callApi(body){
  if(!GAS_URL || GAS_URL.indexOf('PEGA_AQUI') === 0){
    return Promise.resolve({ok:false, error:'Falta configurar GAS_URL en index.html (ver comentario al inicio del archivo).'});
  }
  return fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  }).then(r=>r.json()).catch(()=> jsonp(body));
}
function fetchTodo(){
  if(!GAS_URL || GAS_URL.indexOf('PEGA_AQUI') === 0){
    return Promise.resolve({ok:false, error:'Falta configurar GAS_URL en index.html.'});
  }
  return fetch(GAS_URL).then(r=>r.json()).catch(()=> jsonp(null,true));
}
function jsonp(body, isGet){
  return new Promise((resolve)=>{
    const cbName = 'cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
    window[cbName] = (data)=>{ resolve(data); cleanup(); };
    const script = document.createElement('script');
    const params = new URLSearchParams();
    params.set('callback', cbName);
    if(!isGet) params.set('body', encodeURIComponent(JSON.stringify(body)));
    script.src = GAS_URL + '?' + params.toString();
    script.onerror = ()=>{ resolve({ok:false,error:'No se pudo conectar al servidor.'}); cleanup(); };
    document.body.appendChild(script);
    function cleanup(){ delete window[cbName]; script.remove(); }
    setTimeout(()=>{ if(window[cbName]){ resolve({ok:false,error:'Tiempo de espera agotado.'}); cleanup(); } }, 15000);
  });
}

// ---------- render root ----------
function render(){
  const app = document.getElementById('app');
  if(!state.role){ app.innerHTML=''; app.appendChild(renderLogin()); return; }
  if(state.role==='admin'){ app.innerHTML=''; app.appendChild(renderAdmin()); return; }
  app.innerHTML=''; app.appendChild(renderTrabajador());
}

// ---------- LOGIN ----------
function renderLogin(){
  const wrap = el('div',{class:'center'});
  const card = el('div',{class:'login-card'});
  card.appendChild(el('h1',{},'🍽️ Colaciones Semanales'));
  card.appendChild(el('p',{class:'sub'},'Anótate al menú de la semana o ingresa como administración.'));

  const seg = el('div',{class:'seg'});
  const bT = el('button',{class:'active'},'Soy trabajador/a');
  const bA = el('button',{},'Administración');
  seg.append(bT,bA);
  card.appendChild(seg);

  const formT = el('div',{});
  formT.appendChild(field('Tu RUT','text','loginRut','Ej: 12345678-9',true));
  const btnT = el('button',{class:'btn primary',style:'width:100%;margin-top:6px'},'Ingresar');
  formT.appendChild(btnT);

  const formA = el('div',{hidden:'true'});
  formA.appendChild(field('Clave de administración','password','loginPass',''));
  const btnA = el('button',{class:'btn green',style:'width:100%;margin-top:6px'},'Ingresar como admin');
  formA.appendChild(btnA);

  const msgBox = el('div',{});
  card.append(formT, formA, msgBox);
  wrap.appendChild(card);

  bT.onclick = ()=>{ bT.classList.add('active'); bA.classList.remove('active'); formT.hidden=false; formA.hidden=true; msgBox.innerHTML=''; };
  bA.onclick = ()=>{ bA.classList.add('active'); bT.classList.remove('active'); formA.hidden=false; formT.hidden=true; msgBox.innerHTML=''; };

  btnT.onclick = async ()=>{
    const rut = card.querySelector('#loginRut').value.trim();
    if(!rut){ return; }
    btnT.disabled = true; btnT.textContent='Ingresando…';
    const res = await callApi({action:'loginTrabajador', rut});
    btnT.disabled = false; btnT.textContent='Ingresar';
    if(!res.ok){ msgBox.innerHTML=''; msgBox.appendChild(el('div',{class:'msg err'}, res.error||'No se pudo ingresar')); return; }
    state.role='trabajador';
    state.trabajador = res.trabajador;
    state.data.menus = res.menus||[];
    state.data.pedidos = res.pedidos||[];
    render();
  };
  formT.querySelector('input').addEventListener('keydown', e=>{ if(e.key==='Enter') btnT.click(); });

  btnA.onclick = async ()=>{
    const pass = card.querySelector('#loginPass').value;
    btnA.disabled = true; btnA.textContent='Verificando…';
    const res = await callApi({action:'loginAdmin', password:pass});
    if(!res.ok){
      btnA.disabled=false; btnA.textContent='Ingresar como admin';
      msgBox.innerHTML=''; msgBox.appendChild(el('div',{class:'msg err'}, res.error||'Clave incorrecta'));
      return;
    }
    const todo = await fetchTodo();
    btnA.disabled=false; btnA.textContent='Ingresar como admin';
    if(!todo.ok){ msgBox.innerHTML=''; msgBox.appendChild(el('div',{class:'msg err'}, todo.error||'No se pudieron cargar los datos')); return; }
    state.role='admin';
    state.data = todo;
    render();
  };
  formA.querySelector('input').addEventListener('keydown', e=>{ if(e.key==='Enter') btnA.click(); });

  return wrap;
}

// ---------- shared header ----------
function topHeader(title, who, onExit){
  const hdr = el('div',{class:'hdr no-print'});
  const inn = el('div',{class:'hdr-in'});
  inn.appendChild(el('h1',{},title));
  if(who) inn.appendChild(el('span',{class:'who'}, who));
  const out = el('button',{class:'btn sm'},'Salir');
  out.onclick = onExit;
  inn.appendChild(out);
  hdr.appendChild(inn);
  return hdr;
}

// ============================================================
// TRABAJADOR
// ============================================================
function renderTrabajador(){
  const root = el('div',{});
  root.appendChild(topHeader('🍽️ Colaciones', state.trabajador.nombre, ()=>{ state.role=null; state.trabajador=null; render(); }));
  const wrap = el('div',{class:'wrap'});

  wrap.appendChild(weekNav(()=>renderTrabajadorBody(wrap)));
  root.appendChild(wrap);
  renderTrabajadorBody(wrap);
  return root;
}
function weekNav(onChange){
  const nav = el('div',{class:'week-nav no-print'});
  const prev = el('button',{class:'btn sm'},'‹');
  const lbl = el('div',{class:'lbl'}, fmtSemana(state.semanaRef));
  const next = el('button',{class:'btn sm'},'›');
  prev.onclick = ()=>{ state.semanaRef = addDays(state.semanaRef,-7); lbl.textContent = fmtSemana(state.semanaRef); onChange(); };
  next.onclick = ()=>{ state.semanaRef = addDays(state.semanaRef, 7); lbl.textContent = fmtSemana(state.semanaRef); onChange(); };
  nav.append(prev,lbl,next);
  return nav;
}
function renderTrabajadorBody(wrap){
  // remove previous body (everything after week-nav holder)
  Array.from(wrap.children).slice(1).forEach(c=>c.remove());
  const semana = iso(state.semanaRef);
  const menusSemana = state.data.menus.filter(m=>String(m.semana).trim()===semana && String(m.activo).toLowerCase()!=='no');
  const misPedidos = state.data.pedidos.filter(p=>String(p.semana).trim()===semana);

  if(state.msg){ wrap.appendChild(el('div',{class:`msg ${state.msg.type}`}, state.msg.text)); state.msg=null; }

  if(!menusSemana.length){
    wrap.appendChild(el('div',{class:'card'}, el('div',{class:'empty'},'Aún no se ha publicado el menú para esta semana.')));
    return;
  }

  const diasConMenu = DIAS.filter(d=>menusSemana.some(m=>m.dia===d));
  diasConMenu.forEach(dia=>{
    const opciones = menusSemana.filter(m=>m.dia===dia);
    const especial = esDiaEspecial(opciones);
    const card = el('div',{class:'day-card'+(especial?' especial':'')});
    const h3 = el('h3',{}, `${dia} · ${fechaDia(state.semanaRef,dia).split('-').reverse().join('-')}`);
    if(especial) h3.appendChild(el('span',{class:'pill especial'},'🌟 Almuerzo mejorado'));
    card.appendChild(h3);
    const actual = misPedidos.find(p=>p.dia===dia);
    opciones.forEach(o=>{
      const isSel = actual && String(actual.opcion)===String(o.opcion);
      const optEl = el('label',{class:'opt'+(isSel?' sel':'')});
      const radio = el('input',{type:'radio', name:'dia_'+dia});
      radio.checked = isSel;
      optEl.appendChild(radio);
      const txt = el('div',{class:'txt'});
      txt.appendChild(el('span',{class:'code'}, o.opcion+':'));
      txt.appendChild(document.createTextNode(o.descripcion||''));
      optEl.appendChild(txt);
      optEl.onclick = async (e)=>{
        e.preventDefault();
        if(isSel) return;
        optEl.style.opacity=.6;
        const res = await callApi({action:'guardarPedido', data:{
          semana, rut: state.trabajador.rut, nombre: state.trabajador.nombre, dia, opcion:o.opcion
        }});
        if(res.ok){
          const idx = state.data.pedidos.findIndex(p=>p.semana===semana && p.dia===dia && normRut(p.rut)===normRut(state.trabajador.rut));
          const nuevo = {semana, rut:state.trabajador.rut, nombre:state.trabajador.nombre, dia, opcion:o.opcion, timestamp:new Date().toISOString()};
          if(idx>=0) state.data.pedidos[idx]=nuevo; else state.data.pedidos.push(nuevo);
          state.msg = {type:'ok', text:`Elegiste la opción ${o.opcion} para ${dia}.`};
        } else {
          state.msg = {type:'err', text: res.error||'No se pudo guardar tu elección.'};
        }
        renderTrabajadorBody(wrap);
      };
      card.appendChild(optEl);
    });
    wrap.appendChild(card);
  });

  const resumen = el('div',{class:'card'});
  resumen.appendChild(el('h2',{},'Lo que pediste esta semana'));
  if(!misPedidos.length){
    resumen.appendChild(el('div',{class:'empty'},'Todavía no has elegido ninguna opción.'));
  } else {
    const tblWrap = el('div',{class:'tbl-wrap'});
    const tbl = el('table',{});
    const thead = el('tr',{}); ['Día','Opción'].forEach(h=>thead.appendChild(el('th',{},h)));
    tbl.appendChild(thead);
    DIAS.filter(d=>menusSemana.some(m=>m.dia===d)).forEach(d=>{
      const p = misPedidos.find(x=>x.dia===d);
      const tr = el('tr',{});
      tr.appendChild(el('td',{},d));
      tr.appendChild(el('td',{}, p?el('span',{class:'pill blue'},p.opcion):el('span',{class:'pill no'},'Sin elegir')));
      tbl.appendChild(tr);
    });
    tblWrap.appendChild(tbl);
    resumen.appendChild(tblWrap);
  }
  wrap.appendChild(resumen);
}
function normRut(r){ return String(r||'').toLowerCase().replace(/\.|-|\s/g,'').trim(); }
function esDiaEspecial(opciones){ return opciones.some(o=>String(o.especial||'').toLowerCase()==='si'); }

// ============================================================
// ADMIN
// ============================================================
function renderAdmin(){
  const root = el('div',{});
  root.appendChild(topHeader('🍽️ Colaciones · Administración', '', ()=>{ state.role=null; state.admin=false; render(); }));
  const wrap = el('div',{class:'wrap'});

  const tabs = el('div',{class:'tabs no-print'});
  const defs = [['trabajadores','Trabajadores'],['menu','Menú semanal'],['reportes','Reportes']];
  defs.forEach(([key,label])=>{
    const t = el('button',{class:'tab'+(state.adminTab===key?' active':'')}, label);
    t.onclick = ()=>{ state.adminTab=key; render(); };
    tabs.appendChild(t);
  });
  wrap.appendChild(tabs);

  if(state.adminTab==='trabajadores') wrap.appendChild(renderAdminTrabajadores());
  if(state.adminTab==='menu') wrap.appendChild(renderAdminMenu());
  if(state.adminTab==='reportes') wrap.appendChild(renderAdminReportes());

  root.appendChild(wrap);
  return root;
}

// ---- Admin: Trabajadores ----
function renderAdminTrabajadores(){
  const box = el('div',{});
  const form = el('div',{class:'card no-print'});
  form.appendChild(el('h2',{},'Agregar / editar trabajador'));
  const row = el('div',{class:'row'});
  row.appendChild(field('RUT','text','fRut','12345678-9',true));
  row.appendChild(field('Nombre completo','text','fNombre',''));
  form.appendChild(row);

  const row2 = el('div',{class:'row'});
  const fTipo = el('div',{class:'field'});
  fTipo.appendChild(el('label',{},'Tipo'));
  const selTipo = el('select',{id:'fTipo'});
  selTipo.appendChild(el('option',{value:'Fijo'},'Fijo'));
  selTipo.appendChild(el('option',{value:'Spot'},'Spot (visita/cliente temporal)'));
  fTipo.appendChild(selTipo);
  row2.appendChild(fTipo);
  row2.appendChild(field('Vigente desde (spot)','date','fInicio',''));
  row2.appendChild(field('Vigente hasta (spot)','date','fFin',''));
  form.appendChild(row2);
  form.appendChild(field('Notas (opcional)','text','fNotas',''));

  const msgBox = el('div',{});
  const btnRow = el('div',{class:'row'});
  const btnGuardar = el('button',{class:'btn primary'},'Guardar trabajador');
  btnRow.appendChild(btnGuardar);
  form.append(msgBox, btnRow);
  box.appendChild(form);

  btnGuardar.onclick = async ()=>{
    const rut = form.querySelector('#fRut').value.trim();
    const nombre = form.querySelector('#fNombre').value.trim();
    const tipo = form.querySelector('#fTipo').value;
    const fechaInicio = form.querySelector('#fInicio').value;
    const fechaFin = form.querySelector('#fFin').value;
    const notas = form.querySelector('#fNotas').value.trim();
    if(!rut || !nombre){ msgBox.innerHTML=''; msgBox.appendChild(el('div',{class:'msg err'},'Ingresa RUT y nombre.')); return; }
    btnGuardar.disabled=true; btnGuardar.textContent='Guardando…';
    const res = await callApi({action:'guardarTrabajador', data:{rut,nombre,tipo,activo:'Si',fechaInicio,fechaFin,notas}});
    btnGuardar.disabled=false; btnGuardar.textContent='Guardar trabajador';
    msgBox.innerHTML='';
    if(res.ok){
      msgBox.appendChild(el('div',{class:'msg ok'},'Trabajador guardado.'));
      const idx = state.data.trabajadores.findIndex(t=>normRut(t.rut)===normRut(rut));
      const nuevo = {rut,nombre,tipo,activo:'Si',fechainicio:fechaInicio,fechafin:fechaFin,notas};
      if(idx>=0) state.data.trabajadores[idx]=nuevo; else state.data.trabajadores.push(nuevo);
      form.querySelectorAll('input').forEach(i=>i.value='');
      render();
    } else {
      msgBox.appendChild(el('div',{class:'msg err'}, res.error||'No se pudo guardar.'));
    }
  };

  const listCard = el('div',{class:'card'});
  const head = el('div',{class:'row',style:'justify-content:space-between'});
  head.appendChild(el('h2',{},`Trabajadores (${state.data.trabajadores.length})`));
  listCard.appendChild(head);
  const tblWrap = el('div',{class:'tbl-wrap'});
  const tbl = el('table',{});
  const thead = el('tr',{}); ['RUT','Nombre','Tipo','Vigencia','Activo','',''].forEach(h=>thead.appendChild(el('th',{},h)));
  tbl.appendChild(thead);
  state.data.trabajadores.slice().sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre))).forEach(t=>{
    const tr = el('tr',{});
    tr.appendChild(el('td',{},t.rut));
    tr.appendChild(el('td',{},t.nombre));
    tr.appendChild(el('td',{}, t.tipo==='Spot'?el('span',{class:'pill spot'},'Spot'):el('span',{class:'pill blue'},'Fijo')));
    tr.appendChild(el('td',{}, t.tipo==='Spot' ? `${t.fechainicio||'?'} → ${t.fechafin||'?'}` : '—'));
    tr.appendChild(el('td',{}, String(t.activo).toLowerCase()==='si'? el('span',{class:'pill ok'},'Activo') : el('span',{class:'pill no'},'Inactivo')));
    const tdToggle = el('td',{class:'no-print'});
    const btnToggle = el('button',{class:'btn sm'}, String(t.activo).toLowerCase()==='si'?'Desactivar':'Activar');
    btnToggle.onclick = async ()=>{
      const nuevoActivo = String(t.activo).toLowerCase()==='si' ? 'No':'Si';
      btnToggle.disabled=true;
      const res = await callApi({action:'guardarTrabajador', isEdit:true, data:{
        rut:t.rut, nombre:t.nombre, tipo:t.tipo, activo:nuevoActivo, fechaInicio:t.fechainicio, fechaFin:t.fechafin, notas:t.notas
      }});
      if(res.ok){ t.activo = nuevoActivo; render(); } else { btnToggle.disabled=false; alert(res.error||'Error'); }
    };
    tdToggle.appendChild(btnToggle);
    tr.appendChild(tdToggle);
    const tdDel = el('td',{class:'no-print'});
    const btnDel = el('button',{class:'btn sm danger'},'Eliminar');
    btnDel.onclick = async ()=>{
      if(!confirm(`¿Eliminar a ${t.nombre}? Esta acción no se puede deshacer.`)) return;
      btnDel.disabled=true;
      const res = await callApi({action:'eliminarTrabajador', rut:t.rut});
      if(res.ok){ state.data.trabajadores = state.data.trabajadores.filter(x=>normRut(x.rut)!==normRut(t.rut)); render(); }
      else { btnDel.disabled=false; alert(res.error||'Error'); }
    };
    tdDel.appendChild(btnDel);
    tr.appendChild(tdDel);
    tbl.appendChild(tr);
  });
  tblWrap.appendChild(tbl);
  listCard.appendChild(tblWrap);
  box.appendChild(listCard);
  return box;
}

// ---- Admin: Menú semanal ----
function renderAdminMenu(){
  const box = el('div',{});
  const nav = el('div',{class:'week-nav no-print'});
  const prev = el('button',{class:'btn sm'},'‹');
  const lbl = el('div',{class:'lbl'}, fmtSemana(state.semanaRef));
  const next = el('button',{class:'btn sm'},'›');
  prev.onclick=()=>{ state.semanaRef=addDays(state.semanaRef,-7); render(); };
  next.onclick=()=>{ state.semanaRef=addDays(state.semanaRef,7); render(); };
  nav.append(prev,lbl,next);
  box.appendChild(nav);

  const toolbar = el('div',{class:'toolbar no-print'});
  const btnCopiar = el('button',{class:'btn'},'Copiar menú de la semana anterior');
  btnCopiar.onclick = async ()=>{
    const origen = iso(addDays(state.semanaRef,-7));
    const destino = iso(state.semanaRef);
    btnCopiar.disabled=true;
    const res = await callApi({action:'copiarMenuSemana', semanaOrigen:origen, semanaDestino:destino});
    btnCopiar.disabled=false;
    if(res.ok){
      const copiadas = state.data.menus.filter(m=>m.semana===origen).map(m=>({...m, semana:destino}));
      state.data.menus.push(...copiadas);
      render();
    } else alert(res.error||'Error');
  };
  toolbar.appendChild(btnCopiar);
  box.appendChild(toolbar);

  const semana = iso(state.semanaRef);
  DIAS.forEach(dia=>{
    const opciones = state.data.menus.filter(m=>m.semana===semana && m.dia===dia);
    opciones.sort((a,b)=>String(a.opcion).localeCompare(String(b.opcion)));
    const especial = esDiaEspecial(opciones);
    const card = el('div',{class:'card'+(especial?' especial':'')});
    const head = el('div',{class:'row',style:'justify-content:space-between'});
    head.appendChild(el('h2',{}, dia + (especial?' 🌟':'')));
    if(opciones.length){
      const lblEsp = el('label',{style:'display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--amber);cursor:pointer'});
      const chkEsp = el('input',{type:'checkbox'});
      chkEsp.checked = especial;
      lblEsp.append(chkEsp, document.createTextNode('🌟 Almuerzo mejorado este día'));
      chkEsp.onchange = async ()=>{
        chkEsp.disabled = true;
        const res = await callApi({action:'marcarDiaEspecial', semana, dia, especial:chkEsp.checked});
        chkEsp.disabled = false;
        if(res.ok){
          opciones.forEach(o=>o.especial = chkEsp.checked ? 'Si':'No');
          render();
        } else { chkEsp.checked = !chkEsp.checked; alert(res.error||'Error'); }
      };
      head.appendChild(lblEsp);
    }
    card.appendChild(head);
    opciones.forEach(o=>{
      const r = el('div',{class:'row',style:'align-items:flex-start'});
      const codeField = el('div',{class:'field',style:'max-width:70px'});
      codeField.appendChild(el('label',{},'Opción'));
      const inpCode = el('input',{type:'text',value:o.opcion,style:'text-align:center;font-weight:800'});
      inpCode.disabled = true;
      codeField.appendChild(inpCode);
      const descField = el('div',{class:'field'});
      descField.appendChild(el('label',{},'Descripción'));
      const inpDesc = el('input',{type:'text',value:o.descripcion||''});
      descField.appendChild(inpDesc);
      const btnSave = el('button',{class:'btn sm primary',style:'margin-top:18px'},'Guardar');
      btnSave.onclick = async ()=>{
        btnSave.disabled=true;
        const res = await callApi({action:'guardarMenu', data:{semana,dia,opcion:o.opcion,descripcion:inpDesc.value.trim()}});
        btnSave.disabled=false;
        if(res.ok){ o.descripcion = inpDesc.value.trim(); btnSave.textContent='✓'; setTimeout(()=>btnSave.textContent='Guardar',1000); }
        else alert(res.error||'Error');
      };
      const btnDel = el('button',{class:'btn sm danger',style:'margin-top:18px'},'Quitar');
      btnDel.onclick = async ()=>{
        if(!confirm('¿Quitar esta opción del menú?')) return;
        btnDel.disabled=true;
        const res = await callApi({action:'eliminarMenu', semana, dia, opcion:o.opcion});
        if(res.ok){ state.data.menus = state.data.menus.filter(m=>!(m.semana===semana&&m.dia===dia&&m.opcion===o.opcion)); render(); }
        else { btnDel.disabled=false; alert(res.error||'Error'); }
      };
      r.append(codeField, descField, btnSave, btnDel);
      card.appendChild(r);
    });

    const addRow = el('div',{class:'row',style:'align-items:flex-end'});
    const nextCode = String.fromCharCode(65 + opciones.length); // A, B, C...
    const codeField2 = el('div',{class:'field',style:'max-width:70px'});
    codeField2.appendChild(el('label',{},'Nueva opción'));
    const inpNewCode = el('input',{type:'text',value:nextCode,style:'text-align:center;font-weight:800',maxlength:'2'});
    codeField2.appendChild(inpNewCode);
    const descField2 = el('div',{class:'field'});
    descField2.appendChild(el('label',{},'Descripción'));
    const inpNewDesc = el('input',{type:'text',placeholder:'Ej: Pollo al horno con arroz'});
    descField2.appendChild(inpNewDesc);
    const btnAdd = el('button',{class:'btn green',style:'margin-bottom:12px'},'Agregar opción');
    btnAdd.onclick = async ()=>{
      const opcion = inpNewCode.value.trim().toUpperCase();
      const descripcion = inpNewDesc.value.trim();
      if(!opcion || !descripcion) return;
      btnAdd.disabled=true;
      const res = await callApi({action:'guardarMenu', data:{semana,dia,opcion,descripcion}});
      btnAdd.disabled=false;
      if(res.ok){ state.data.menus.push({semana,dia,opcion,descripcion,activo:'Si',especial:especial?'Si':'No'}); render(); }
      else alert(res.error||'Error');
    };
    addRow.append(codeField2, descField2, btnAdd);
    card.appendChild(addRow);
    box.appendChild(card);
  });
  return box;
}

// ---- Admin: Reportes ----
function renderAdminReportes(){
  const box = el('div',{});
  const nav = el('div',{class:'week-nav no-print'});
  const prev = el('button',{class:'btn sm'},'‹');
  const lbl = el('div',{class:'lbl'}, fmtSemana(state.semanaRef));
  const next = el('button',{class:'btn sm'},'›');
  prev.onclick=()=>{ state.semanaRef=addDays(state.semanaRef,-7); render(); };
  next.onclick=()=>{ state.semanaRef=addDays(state.semanaRef,7); render(); };
  nav.append(prev,lbl,next);
  box.appendChild(nav);

  const semana = iso(state.semanaRef);
  const finSemana = iso(addDays(state.semanaRef,4));
  const menusSemana = state.data.menus.filter(m=>m.semana===semana);
  const pedidosSemana = state.data.pedidos.filter(p=>p.semana===semana);

  // trabajadores vigentes esta semana: fijos activos + spot cuya vigencia cruza la semana
  const elegibles = state.data.trabajadores.filter(t=>{
    if(String(t.activo).toLowerCase()!=='si') return false;
    if(String(t.tipo)!=='Spot') return true;
    const ini = t.fechainicio || '0000-01-01';
    const fin = t.fechafin || '9999-12-31';
    return ini <= finSemana && fin >= semana;
  });

  const rutsAnotados = new Set(pedidosSemana.map(p=>normRut(p.rut)));
  const anotados = elegibles.filter(t=>rutsAnotados.has(normRut(t.rut)));
  const noAnotados = elegibles.filter(t=>!rutsAnotados.has(normRut(t.rut)));
  const diasEspeciales = new Set(DIAS.filter(d=>esDiaEspecial(menusSemana.filter(m=>m.dia===d))));
  const anotadosEnEspeciales = pedidosSemana.filter(p=>diasEspeciales.has(p.dia)).length;

  const toolbar = el('div',{class:'toolbar no-print'});
  const btnPdf = el('button',{class:'btn'},'📄 Exportar / imprimir PDF');
  btnPdf.onclick = ()=>window.print();
  const btnCsv = el('button',{class:'btn'},'⬇️ Exportar CSV');
  btnCsv.onclick = ()=>exportarCsv(semana, elegibles, pedidosSemana, menusSemana, diasEspeciales);
  toolbar.append(btnPdf, btnCsv);
  box.appendChild(toolbar);

  const stats = el('div',{class:'stat-row'});
  stats.appendChild(statBox(elegibles.length,'Trabajadores vigentes',''));
  stats.appendChild(statBox(anotados.length,'Anotados','ok'));
  stats.appendChild(statBox(noAnotados.length,'Sin anotarse','no'));
  if(diasEspeciales.size) stats.appendChild(statBox(anotadosEnEspeciales,'🌟 Anotados en almuerzo mejorado',''));
  box.appendChild(stats);

  if(!menusSemana.length){
    box.appendChild(el('div',{class:'card'}, el('div',{class:'empty'},'No hay menú publicado para esta semana.')));
    return box;
  }

  const resumenCard = el('div',{class:'card'});
  resumenCard.appendChild(el('h2',{},'Resumen de opciones elegidas por día'));
  const twrap = el('div',{class:'tbl-wrap'});
  const tbl = el('table',{});
  const diasConMenu = DIAS.filter(d=>menusSemana.some(m=>m.dia===d));
  const headTr = el('tr',{}); headTr.appendChild(el('th',{},'Opción'));
  diasConMenu.forEach(d=>headTr.appendChild(el('th',{}, d + (diasEspeciales.has(d)?' 🌟':''))));
  tbl.appendChild(headTr);
  const codigos = Array.from(new Set(menusSemana.map(m=>m.opcion))).sort();
  codigos.forEach(cod=>{
    const tr = el('tr',{});
    tr.appendChild(el('td',{}, el('span',{class:'pill blue'},cod)));
    diasConMenu.forEach(d=>{
      const n = pedidosSemana.filter(p=>p.dia===d && p.opcion===cod).length;
      tr.appendChild(el('td',{}, String(n)));
    });
    tbl.appendChild(tr);
  });
  const totTr = el('tr',{});
  totTr.appendChild(el('td',{}, el('strong',{},'Total anotados')));
  diasConMenu.forEach(d=>{
    const n = pedidosSemana.filter(p=>p.dia===d).length;
    totTr.appendChild(el('td',{}, el('strong',{},String(n))));
  });
  tbl.appendChild(totTr);
  twrap.appendChild(tbl);
  resumenCard.appendChild(twrap);
  box.appendChild(resumenCard);

  const gridBox = el('div',{class:'grid2'});
  gridBox.appendChild(personListCard(`Anotados (${anotados.length})`, anotados, true, pedidosSemana, diasConMenu, diasEspeciales));
  gridBox.appendChild(personListCard(`Sin anotarse (${noAnotados.length})`, noAnotados, false, pedidosSemana, diasConMenu, diasEspeciales));
  box.appendChild(gridBox);

  return box;
}
function statBox(n,label,cls){
  return el('div',{class:'stat '+(cls||'')}, el('div',{class:'n'},String(n)), el('div',{class:'l'},label));
}
function personListCard(title, list, showOptions, pedidosSemana, dias, diasEspeciales){
  const card = el('div',{class:'card'});
  card.appendChild(el('h2',{},title));
  if(!list.length){ card.appendChild(el('div',{class:'empty'},'Sin registros.')); return card; }
  const twrap = el('div',{class:'tbl-wrap'});
  const tbl = el('table',{});
  const head = el('tr',{}); ['Nombre','RUT'].forEach(h=>head.appendChild(el('th',{},h)));
  if(showOptions) dias.forEach(d=>head.appendChild(el('th',{}, d.slice(0,3) + (diasEspeciales&&diasEspeciales.has(d)?' 🌟':''))));
  tbl.appendChild(head);
  list.slice().sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre))).forEach(t=>{
    const tr = el('tr',{});
    tr.appendChild(el('td',{},t.nombre + (t.tipo==='Spot'?' 🔸':'')));
    tr.appendChild(el('td',{},t.rut));
    if(showOptions){
      dias.forEach(d=>{
        const p = pedidosSemana.find(x=>normRut(x.rut)===normRut(t.rut) && x.dia===d);
        tr.appendChild(el('td',{}, p?p.opcion:'—'));
      });
    }
    tbl.appendChild(tr);
  });
  twrap.appendChild(tbl);
  card.appendChild(twrap);
  return card;
}
function exportarCsv(semana, elegibles, pedidosSemana, menusSemana, diasEspeciales){
  const dias = DIAS.filter(d=>menusSemana.some(m=>m.dia===d));
  const encabezadosDias = dias.map(d=>d + (diasEspeciales&&diasEspeciales.has(d)?' (mejorado)':''));
  const rows = [['Nombre','RUT','Tipo', ...encabezadosDias]];
  elegibles.slice().sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre))).forEach(t=>{
    const row = [t.nombre, t.rut, t.tipo];
    dias.forEach(d=>{
      const p = pedidosSemana.find(x=>normRut(x.rut)===normRut(t.rut) && x.dia===d);
      row.push(p?p.opcion:'Sin anotarse');
    });
    rows.push(row);
  });
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `colaciones_${semana}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

// ---------- dom helper ----------
function el(tag, attrs, ...children){
  const n = document.createElement(tag);
  Object.entries(attrs||{}).forEach(([k,v])=>{
    if(k==='hidden'){ n.hidden = true; return; }
    if(k==='style'){ n.setAttribute('style',v); return; }
    n.setAttribute(k,v);
  });
  children.forEach(c=>{
    if(c==null) return;
    n.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(c) : c);
  });
  return n;
}
function field(labelText, type, id, placeholder, isRut){
  const f = el('div',{class:'field'});
  f.appendChild(el('label',{for:id}, labelText));
  const attrs = {type, id, placeholder: placeholder||''};
  if(isRut){ attrs.inputmode='text'; attrs.autocapitalize='characters'; attrs.maxlength='12'; }
  const input = el('input',attrs);
  if(isRut) input.addEventListener('input', ()=>{ input.value = formatRut(input.value); });
  f.appendChild(input);
  return f;
}
// Da formato XXXXXXXX-X a un RUT chileno mientras se escribe (acepta con o sin puntos/guion).
function formatRut(value){
  let v = String(value||'').toUpperCase().replace(/[^0-9K]/g,'');
  if(v.length <= 1) return v;
  const cuerpo = v.slice(0,-1);
  const dv = v.slice(-1);
  return cuerpo + '-' + dv;
}

render();
})();
